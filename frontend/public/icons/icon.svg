<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAFAFC" />
      <stop offset="100%" stop-color="#EDE9FE" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#8B5CF6" flood-opacity="0.15" />
    </filter>
  </defs>
  
  <!-- Fondo redondeado suave -->
  <rect width="100" height="100" rx="22" fill="url(#bgGrad)" />
  
  <!-- Relaciones UML punteadas -->
  <path d="M40 50 L60 25 M40 50 L60 75" stroke="#6B7280" stroke-opacity="0.4" stroke-width="2" stroke-dasharray="3 3" />
  
  <!-- Clases UML -->
  <rect x="10" y="40" width="30" height="20" rx="4" fill="#8B5CF6" filter="url(#shadow)" />
  <rect x="60" y="15" width="30" height="20" rx="4" fill="#F9A8D4" filter="url(#shadow)" />
  <rect x="60" y="65" width="30" height="20" rx="4" fill="#38BDF8" filter="url(#shadow)" />
  
  <!-- Nodos interiores -->
  <circle cx="25" cy="50" r="3" fill="#FFFFFF" />
  <circle cx="75" cy="25" r="3" fill="#FFFFFF" />
  <circle cx="75" cy="75" r="3" fill="#FFFFFF" />
  
  <!-- Destello inteligente AI -->
  <path d="M45 40 Q 50 30 55 35 T 65 45" stroke="#EC4899" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.9" />
  <circle cx="50" cy="30" r="1.5" fill="#8B5CF6" />
</svg>
