services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-umlforge_ai}
      POSTGRES_USER: ${DB_USER:-umlforge}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Configure DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - umlforge_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-umlforge_ai}
      DB_USER: ${DB_USER:-umlforge}
      DB_PASSWORD: ${DB_PASSWORD:?Configure DB_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Configure JWT_SECRET in .env}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      JPA_SHOW_SQL: "false"
      OLLAMA_ENABLED: "false"
      CHAT_OLLAMA_ENABLED: "false"
      IMAGE_OLLAMA_ENABLED: "false"
      GEMINI_REQUEST_TIMEOUT_SECONDS: ${GEMINI_REQUEST_TIMEOUT_SECONDS:-45}
      GEMINI_ENABLED: "true"
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      CHAT_GEMINI_TIMEOUT_SECONDS: ${CHAT_GEMINI_TIMEOUT_SECONDS:-45}
      CHAT_GROQ_ENABLED: ${CHAT_GROQ_ENABLED:-true}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      GROQ_BASE_URL: ${GROQ_BASE_URL:-https://api.groq.com/openai/v1}
      CHAT_GROQ_TIMEOUT_SECONDS: ${CHAT_GROQ_TIMEOUT_SECONDS:-45}
      CHAT_OPENROUTER_ENABLED: ${CHAT_OPENROUTER_ENABLED:-true}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-oss-120b}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      CHAT_OPENROUTER_TIMEOUT_SECONDS: ${CHAT_OPENROUTER_TIMEOUT_SECONDS:-45}
      IMAGE_GEMINI_ENABLED: "true"
      IMAGE_GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      IMAGE_GEMINI_MODEL: ${IMAGE_GEMINI_MODEL:-gemini-3.5-flash-lite}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=75.0}
      CHAT_ATTACHMENTS_STORAGE_PATH: /data/chat-attachments
      CHAT_ATTACHMENTS_MAX_FILE_BYTES: ${CHAT_ATTACHMENTS_MAX_FILE_BYTES:-10485760}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@18.214.98.32.sslip.io}
      PUSH_ENABLED: ${PUSH_ENABLED:-true}
    volumes:
      - chat_attachments:/data/chat-attachments
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - umlforge_internal
    expose:
      - "8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
        VITE_WS_URL: /ws-uml
        VITE_ENABLE_DEMO_CREDENTIALS: ${VITE_ENABLE_DEMO_CREDENTIALS:-true}
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - umlforge_internal
    expose:
      - "80"

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
    networks:
      - umlforge_internal

networks:
  umlforge_internal:
    driver: bridge

volumes:
  postgres_data:
  chat_attachments:
  caddy_data:
  caddy_config:
