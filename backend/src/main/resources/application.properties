spring.application.name=backend
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/umlforge_ai}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=25MB

# CU16 - Adjuntos privados del chat
chat.attachments.storage-path=${CHAT_ATTACHMENTS_STORAGE_PATH:./data/chat-attachments}
chat.attachments.max-file-bytes=${CHAT_ATTACHMENTS_MAX_FILE_BYTES:10485760}

# CU8 - Proveedores de inteligencia artificial

ia.ollama.enabled=${OLLAMA_ENABLED:true}
ia.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
ia.ollama.model=${OLLAMA_MODEL:qwen2.5:1.5b}
ia.ollama.num-ctx=${OLLAMA_NUM_CTX:3072}
ia.ollama.num-predict=${OLLAMA_NUM_PREDICT:1200}
ia.ollama.temperature=${OLLAMA_TEMPERATURE:0.0}
ia.ollama.keep-alive=${OLLAMA_KEEP_ALIVE:10m}

ia.gemini.enabled=${GEMINI_ENABLED:true}
ia.gemini.api-key=${GEMINI_API_KEY:}
ia.gemini.model=${GEMINI_MODEL:gemini-3.5-flash-lite}

# Timeouts separados; IA_REQUEST_TIMEOUT_SECONDS se conserva como compatibilidad.
ia.gemini.request-timeout-seconds=${GEMINI_REQUEST_TIMEOUT_SECONDS:${IA_REQUEST_TIMEOUT_SECONDS:45}}
ia.ollama.request-timeout-seconds=${OLLAMA_REQUEST_TIMEOUT_SECONDS:${IA_REQUEST_TIMEOUT_SECONDS:90}}

# CU16 - IA conversacional compartida por proyecto
# Gemini y Ollama reutilizan por defecto la configuración anterior.
ia.chat.gemini.enabled=${CHAT_GEMINI_ENABLED:${GEMINI_ENABLED:true}}
ia.chat.gemini.api-key=${CHAT_GEMINI_API_KEY:${GEMINI_API_KEY:}}
ia.chat.gemini.model=${CHAT_GEMINI_MODEL:${GEMINI_MODEL:gemini-3.5-flash-lite}}
ia.chat.gemini.base-url=${CHAT_GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
ia.chat.gemini.timeout-seconds=${CHAT_GEMINI_TIMEOUT_SECONDS:45}

ia.chat.groq.enabled=${CHAT_GROQ_ENABLED:true}
ia.chat.groq.api-key=${GROQ_API_KEY:}
ia.chat.groq.model=${GROQ_MODEL:openai/gpt-oss-120b}
ia.chat.groq.base-url=${GROQ_BASE_URL:https://api.groq.com/openai/v1}
ia.chat.groq.timeout-seconds=${CHAT_GROQ_TIMEOUT_SECONDS:45}

ia.chat.openrouter.enabled=${CHAT_OPENROUTER_ENABLED:true}
ia.chat.openrouter.api-key=${OPENROUTER_API_KEY:}
ia.chat.openrouter.model=${OPENROUTER_MODEL:openai/gpt-oss-120b}
ia.chat.openrouter.base-url=${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
ia.chat.openrouter.timeout-seconds=${CHAT_OPENROUTER_TIMEOUT_SECONDS:45}

ia.chat.ollama.enabled=${CHAT_OLLAMA_ENABLED:${OLLAMA_ENABLED:true}}
ia.chat.ollama.base-url=${CHAT_OLLAMA_BASE_URL:${OLLAMA_BASE_URL:http://localhost:11434}}
ia.chat.ollama.model=${CHAT_OLLAMA_MODEL:${OLLAMA_MODEL:qwen2.5:1.5b}}
ia.chat.ollama.timeout-seconds=${CHAT_OLLAMA_TIMEOUT_SECONDS:90}

# CU9 - Proveedores de vision para reconstruccion UML desde imagen

ia.image.gemini.enabled=${IMAGE_GEMINI_ENABLED:true}
ia.image.gemini.api-key=${IMAGE_GEMINI_API_KEY:${GEMINI_API_KEY:}}
ia.image.gemini.model=${IMAGE_GEMINI_MODEL:gemini-3.5-flash-lite}

ia.image.ollama.enabled=${IMAGE_OLLAMA_ENABLED:true}
ia.image.ollama.base-url=${IMAGE_OLLAMA_BASE_URL:${OLLAMA_BASE_URL:http://localhost:11434}}
ia.image.ollama.model=${IMAGE_OLLAMA_MODEL:gemma3:4b}

ia.image.request-timeout-seconds=${IMAGE_IA_REQUEST_TIMEOUT_SECONDS:60}
