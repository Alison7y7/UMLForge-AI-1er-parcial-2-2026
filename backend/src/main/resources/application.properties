spring.application.name=backend
spring.config.import=optional:file:.env

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/umlforge_ai}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:alison123}

jwt.secret=${JWT_SECRET:4b9b9c9f4d4e3a4b9c9f4d4e3a4b9c9f4d4e3a4b9c9f4d4e3a4b9c9f4d4e3a}
jwt.expiration=${JWT_EXPIRATION:86400000}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# CU8 - Proveedores de inteligencia artificial

ia.ollama.enabled=${OLLAMA_ENABLED:true}
ia.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
ia.ollama.model=${OLLAMA_MODEL:qwen2.5:1.5b}

ia.gemini.enabled=${GEMINI_ENABLED:true}
ia.gemini.api-key=${GEMINI_API_KEY:}
ia.gemini.model=${GEMINI_MODEL:gemini-2.0-flash}

ia.request-timeout-seconds=${IA_REQUEST_TIMEOUT_SECONDS:45}

# CU9 - Proveedores de vision para reconstruccion UML desde imagen

ia.image.gemini.enabled=${IMAGE_GEMINI_ENABLED:true}
ia.image.gemini.api-key=${IMAGE_GEMINI_API_KEY:${GEMINI_API_KEY:}}
ia.image.gemini.model=${IMAGE_GEMINI_MODEL:gemini-2.0-flash}

ia.image.ollama.enabled=${IMAGE_OLLAMA_ENABLED:true}
ia.image.ollama.base-url=${IMAGE_OLLAMA_BASE_URL:${OLLAMA_BASE_URL:http://localhost:11434}}
ia.image.ollama.model=${IMAGE_OLLAMA_MODEL:gemma3:4b}

ia.image.request-timeout-seconds=${IMAGE_IA_REQUEST_TIMEOUT_SECONDS:60}
